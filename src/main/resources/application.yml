spring:
  application:
    name: swingmate-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swingmate}
    username: ${DB_USERNAME:swingmate}
    password: ${DB_PASSWORD:swingmate}
    hikari:
      data-source-properties:
        # 유니크 제약 위반 시 PostgreSQL 오류 상세(휴대폰 번호 등 실제 값)가 로그에 찍히지 않게 한다.
        logServerErrorDetail: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  # 운영에서는 반드시 JWT_SECRET 환경 변수로 32바이트 이상 값을 주입한다.
  secret: ${JWT_SECRET:swingmate-local-development-secret-key-change-me-please}
  access-token-validity: 1h
  refresh-token-validity: 30d
  onboarding-token-validity: 1h
  verification-token-validity: 10m

sms:
  # SMS 사업자가 정해지기 전까지 실제 발송 없이 이 인증번호만 통과한다. 사업자 연동 시 제거.
  fake-code: ${SMS_FAKE_CODE:123456}

oauth:
  # true면 카카오/Google 서버를 호출하지 않고 idToken 문자열을 공급자 사용자 ID로 사용한다. 로컬 개발 전용.
  mock-enabled: ${OAUTH_MOCK_ENABLED:false}
  kakao:
    # 카카오 앱 ID(숫자). 비어 있으면 실제 카카오 로그인은 거부된다.
    app-id: ${KAKAO_APP_ID:}
  google:
    # 앱에서 사용하는 Google OAuth 클라이언트 ID 목록(쉼표 구분). ID Token의 aud와 비교한다.
    client-ids: ${GOOGLE_CLIENT_IDS:}
